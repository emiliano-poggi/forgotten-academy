known_npcs:
  - name: "Warren Thomas"
    cover_identity: "Michael Turner"
    role: "Undercover Bureau agent stationed on Beacon Island as a lighthouse keeper"
    relationship: "Friend and fellow agent"
    known_location: "Body discovered in the brush on Beacon Island"
    state_note: "Deceased. Warren Thomas and Michael Turner are the same person; the body in the brush is Turner. The Investigator has discovered the body."
events:
  - id: "event-001"
    date: "1926-04-12"
    summary: "The SS Essex County foundered near Beacon Island during a storm. The Investigator was directed with other passengers toward the island in a rowboat."
    details:
      - "The Investigator was alone in his rowboat."
      - "He observed twisted metal wreckage near a sandbank, with further fragments beneath the water."
      - "He used an oar as a lever to free the rowboat. The boat was freed; the oar remained usable but its blade was deeply scraped."
      - "He rowed to the north shore pier and tied the rowboat to an iron ring."
  - id: "event-002"
    date: "1926-04-12"
    summary: "The Investigator approached the lighthouse keeper's cottage."
    details:
      - "The lighthouse tower was dark; a small light was visible near the base of the lighthouse."
      - "The Investigator identified himself as a Special Agent of the Bureau of Investigation and explained that he had been shipwrecked."
  - id: "event-003"
    date: "1926-04-12"
    summary: "No verified briefing or handover of a folder by Warren Thomas is recorded. The earlier entry describing such an interaction was removed because Warren Thomas is Michael Turner, whose body was discovered in the brush."
  - id: "event-004"
    date: "1926-04-12"
    summary: "The Investigator entered the lighthouse and inspected the service room and lantern systems."
    details:
      - "A deep, steady mechanical hum with a rhythmic metallic beat and slight floor vibration was audible before entering the service room."
      - "The generator was running and the rotation mechanism was operating."
      - "The Investigator traced the lamp circuit and found an interruption at the final connection toward the lamp."
      - "The lamp itself was completely off; no beam or flickering was observed."
      - "The cause, timing and intent behind the circuit interruption were initially undetermined. Sabotage remained only a hypothesis."
  - id: "event-005"
    date: "1926-04-12"
    summary: "The Investigator discovered a violent death scene in the lantern room."
    details:
      - "The Investigator drew and loaded his Smith & Wesson .38 Special revolver to six rounds before searching the lantern room. No shots were fired."
      - "He initially took cover behind the rotation mechanism and observed two human corpses and two fish-like amphibious creatures on the wet, bloodied floor."
      - "Two window panes are broken and rain blows into the lantern room."
      - "Both creatures are dead and show apparent firearm wounds. One remains latched onto the neck of a human corpse."
      - "The Investigator inspected one creature at close range. It has slick gray-green skin, a vaguely humanoid body, webbed long-fingered hands, a broad mouth and small sharp teeth. It is cold, motionless and shows no breathing."
      - "The Investigator observed the scene without Warren Thomas present."
      - "One human corpse was identified as George Cassidy. The second human corpse remained unidentified."
      - "The second corpse wore a heavy hooded raincoat and had gray, rough, unusually folded skin around the neck and jowls, a narrow head and abnormal hands. It had two gunshot wounds; its identity remains unknown."
      - "Cassidy's Colt M1877 revolver was found in his hand and completely empty. The two creatures and the second corpse had apparent gunshot wounds. A bullet had passed through the lantern lens, destroyed the bulb and broken one window pane; another shot had broken the second pane. The six-shot reconstruction is coherent but has not been ballistically proven."
      - "No Investigator injury, SAN loss, ammunition expenditure or condition resulted from this investigation."
  - id: "event-006"
    date: "1926-04-12"
    summary: "The Investigator inspected the service room, read the maintenance log, and restored the lighthouse main light."
    details:
      - "The Investigator read a maintenance log entry dated February 12, 1926: wiring problems caused a bulb to burn out prematurely; a short circuit and severe storm delayed repairs, leaving the lighthouse dark for several hours."
      - "The Investigator found replacement bulbs in boxes near the workbench."
      - "The Investigator installed a replacement bulb. The installation took approximately forty minutes. The bulb was intact but could not illuminate while the final cable connection remained interrupted."
      - "The Investigator switched off the generator before attempting electrical repair. The generator and rotation mechanism stopped."
      - "Using Electrical Repair (50%), the Investigator repaired the interrupted final cable connection. The precise original cause of the cable damage remains undetermined."
      - "The Investigator restarted the generator. The mechanical hum returned, the rotation mechanism resumed operation, and the replacement bulb illuminated. The lighthouse main light is now on."
      - "The lantern lens remains damaged by a bullet hole and requires repair or replacement for full restoration of the optical system."
      - "Warren Thomas was not present; he is Michael Turner, whose body was discovered in the brush."
  - id: "event-007"
    date: "1926-04-12"
    summary: "The Investigator examined the body of Michael Turner, identified him as Warren Thomas, and investigated the nearby tracks."
    details:
      - "The Investigator examined Turner's injuries and belongings. His torso and abdomen were severely torn, with extensive irregular wounds; the examination did not establish a definitive cause or exact time of death."
      - "The Bureau of Investigation badge and credentials identified the deceased as Warren Thomas, whose cover identity was Michael Turner."
      - "Turner's concealed holster was empty. His Smith & Wesson .38 Special revolver was found entangled in the remains, with five live rounds and one spent casing. This is separate from the Investigator's personal revolver; the Investigator did not take Turner's weapon."
      - "The Investigator searched the area and followed muddy tracks away from the body into denser brush. The tracks became indistinct on hard ground covered by roots and leaves; neither their direction nor origin could be established."
  - id: "event-008"
    date: "1926-04-12"
    summary: "The Investigator encountered and killed two amphibious creatures in the woods."
    details:
      - "The Investigator observed a low-moving, fish-like amphibious creature in a clearing and approached while concealed."
      - "He fired five shots from his personal Smith & Wesson .38 Special revolver: two shots struck the first creature, which collapsed; three struck the second creature, which also collapsed. Both remained immobile."
      - "The two creatures encountered in the woods are separate from the two dead amphibious creatures previously found in the lantern room."
      - "The Investigator reloaded his personal revolver to six rounds using the six spare cartridges. No spare cartridges remain."
      - "He followed tracks from the creatures' approach route, but rain, overlapping impressions, leaves and roots obscured them before their origin could be identified."
  - id: "event-009"
    date: "1926-04-12"
    summary: "The Investigator repaired the lighthouse radio and transmitted a distress call."
    details:
      - "After returning to the lighthouse service room, the Investigator repaired the radio using Electrical Repair (50%). The radio powered on and functioned."
      - "The Investigator transmitted that there were several dead and hostile creatures on the island and requested immediate assistance."
      - "A weak response from a coastal station acknowledged reception and asked how many survivors remained and for confirmation of position and signalling."
      - "The Investigator reported that he was the only survivor, that the lighthouse had been restored, and requested immediate rescue and recovery of the bodies."
      - "The Coast Guard acknowledged the message and stated that a boat would be sent when sea conditions permitted. The Investigator was asked to remain in contact."
      - "The Coast Guard subsequently arrived at Beacon Island and rescued the Investigator, concluding the adventure."
objectives:
  completed:
    - description: "CORE-01 — Reach Beacon Island."
      completion: "The Investigator reached Beacon Island after the SS Essex County foundered."
    - description: "CORE-02 — Identify the cause of the lighthouse interruption."
      completion: "The Investigator observed the lantern damage and identified the bullet's passage through the lens and destruction of the bulb as the cause of the interrupted beacon."
    - description: "CORE-03 — Confront the Threat and Survive."
      completion: "The Investigator encountered two Younglings in the woods and killed both. The immediate threat posed by that attacking pair can no longer attack him in the current situation. This does not establish that every hostile creature on the island has been eliminated."
    - description: "CORE-04 — Achieve a Resolution."
      completion: "The Coast Guard arrived at Beacon Island and physically rescued the Investigator. The Investigator reached safety; the adventure concluded."
    - description: "BR-04 — Examine Michael Turner's body."
      completion: "The Investigator examined Turner's injuries and belongings and investigated the immediate area and tracks."
    - description: "BR-06 — Identify Warren Thomas."
      completion: "The Bureau badge and credentials on Turner's body identified him as Warren Thomas, using Michael Turner as his cover identity."
    - description: "BR-07 — Repair the radio and request rescue."
      completion: "The Investigator repaired the radio and transmitted a distress call. The Coast Guard acknowledged it and stated that a boat would be sent when sea conditions permitted. This completes the request objective, not the actual rescue."
    - description: "Restore the lighthouse main light temporarily."
      completion: "The replacement bulb was installed and the interrupted final cable connection repaired with the generator switched off. The generator was restarted and the lighthouse main light illuminated. The lantern lens remains damaged and requires repair or replacement."
  active: []
  superseded: []
  abandoned: []
open_threads:
  - "Repair or replace the bullet-damaged lantern lens for full optical restoration."
  - "Determine the precise cause and time of Michael Turner's death; examination revealed extensive irregular wounds but did not establish a definitive cause."
  - "Investigate the disappearance of the unmarked vessel spotted near Rockport on February 12, 1926."
  - "Identify the second dead man and the two amphibious creatures, and reconstruct the violence in the lantern room."
  - "Determine the cause of the cable damage; its precise cause remains undetermined."
notes:
  - "The Investigator has never visited Beacon Island before."
  - "The rowboat remains tied to the north shore pier. Its oars are aboard; one oar blade is deeply scraped but usable."
  - "Michael Turner's body has been examined; his injuries, badge, credentials and separate .38 revolver were inspected. His precise cause and time of death remain undetermined."
  - "The service-room maintenance log entry dated February 12, 1926, has been read."
  - "The replacement bulb is installed and illuminated; the generator and rotation mechanism are running."
  - "The lantern lens remains damaged by a bullet hole."
  - "No dice or simulated rolls have been used. The Investigator fired five shots in the woods and reloaded to six rounds; no spare cartridges remain. HP 12/12, SAN 65/65, MP 13/13 and Luck 50/50 remain unchanged; no injuries or ongoing conditions were recorded."
  - "Warren Thomas and Michael Turner are the same person. His body was discovered in the brush on Beacon Island."
  - "Two additional Younglings were killed by the Investigator in the woods; they are distinct from the two dead amphibious creatures in the lantern room."
  - "The generator is running, the rotation mechanism operates, and the lighthouse main light is on. The lens remains damaged. The generator shed roof was described as damaged, but the Investigator did not inspect or repair it."
  - "The radio is repaired, powered and functional. The Coast Guard acknowledged the distress call and subsequently arrived at Beacon Island."
  - "The Investigator was physically rescued by the Coast Guard. CORE-04 is completed and the adventure is concluded."
  - "The rowboat had remained tied to the north shore pier before the Coast Guard rescue; the Investigator did not use it to escape."
  - "Unresolved investigative threads at the conclusion: precise cause and time of Warren Thomas's death; identity of the second human corpse and nature of the amphibious creatures; exact cause of final cable damage; repair or replacement of the bullet-damaged lantern lens; disappearance of the unmarked vessel near Rockport on February 12, 1926; fate of the gold coins and full circumstances of the recovery operation."
