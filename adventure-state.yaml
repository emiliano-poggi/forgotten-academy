  - "Repair or replace the bullet-damaged lantern lens for full optical restoration."
  - "Examine Michael Turner's body in the brush and determine the cause of death."
  - "Investigate the disappearance of the unmarked vessel spotted near Rockport on February 12, 1926."
  - "Identify the second dead man and the two amphibious creatures, and reconstruct the violence in the lantern room."
  - "Determine the cause of the cable damage; its precise cause remains undetermined."
