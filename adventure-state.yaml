  session_started: true
known_npcs:
  - name: "Warren Thomas"
    cover_identity: "Michael Turner"
    role: "Undercover Bureau agent stationed on Beacon Island as a lighthouse keeper"
    relationship: "Friend and fellow agent"
    known_location: "Lighthouse lantern room, beside the Investigator"
    state_note: "Accompanied the Investigator to the lighthouse. After being asked to wait at the doorway, he remained near the stairs with his lantern. The Investigator called him into the lantern room after discovering the bodies and creatures; Warren approached, saw the scene, and reacted with shock. He is now nearby."
events:
  - id: "event-001"
    date: "1926-04-12"
    summary: "The SS Essex County foundered near Beacon Island during a storm. The Investigator was directed with other passengers toward the island in a rowboat."
    details:
      - "The Investigator was alone in his rowboat."
      - "He observed twisted metal wreckage near a sandbank, with further fragments beneath the water."
      - "He used an oar as a lever to free the rowboat. The boat was freed; the oar remained usable but its blade was deeply scraped."
      - "He rowed to the north shore pier and tied the rowboat to an iron ring."
  - id: "event-002"
    date: "1926-04-12"
    summary: "The Investigator approached the lighthouse keeper's cottage and was admitted by Warren Thomas."
    details:
      - "The lighthouse tower was dark; a small light was visible near the base of the lighthouse."
      - "The Investigator identified himself as a Special Agent of the Bureau of Investigation and explained that he had been shipwrecked."
      - "The Investigator recognized the man as Warren Thomas."
  - id: "event-003"
    date: "1926-04-12"
    summary: "Warren Thomas briefed the Investigator and handed him a folder of notes."
    details:
      - "Thomas described an unmarked vessel sighted near Rockport on February 12, 1926, during a violent storm, which subsequently disappeared."
      - "Thomas reported strange noises at sea at night and occasions when he thought something was near the rocks; these remain his unverified impressions."
      - "Thomas said lighthouse personnel were unaccounted for and the main light was off."
      - "Thomas said he had found something on the north shore that might relate to the case and offered to show it."
      - "The Investigator briefly skimmed the folder; it concerns the unmarked vessel sighted on February 12, 1926, and its disappearance. It has not been examined in depth."
  - id: "event-004"
    date: "1926-04-12"
    summary: "The Investigator and Warren entered the lighthouse and inspected the service room and lantern systems."
    details:
      - "A deep, steady mechanical hum with a rhythmic metallic beat and slight floor vibration was audible before entering the service room."
      - "The generator was running and the rotation mechanism was operating."
      - "The Investigator traced the lamp circuit and found an interruption at the final connection toward the lamp."
      - "The lamp itself was completely off; no beam or flickering was observed."
      - "The cause, timing and intent behind the circuit interruption remain undetermined. Sabotage is only a hypothesis."
  - id: "event-005"
    date: "1926-04-12"
    summary: "The Investigator discovered a violent death scene in the lantern room."
    details:
      - "The Investigator drew and loaded his Smith & Wesson .38 Special revolver to six rounds before searching the lantern room. No shots were fired."
      - "He initially took cover behind the rotation mechanism and observed two human corpses and two fish-like amphibious creatures on the wet, bloodied floor."
      - "Two window panes are broken and rain blows into the lantern room."
      - "Both creatures are dead and show apparent firearm wounds. One remains latched onto the neck of a human corpse."
      - "The Investigator approached the creatures cautiously with his revolver ready and inspected one at close range. It has slick gray-green skin, a vaguely humanoid body, webbed long-fingered hands, a broad mouth and small sharp teeth. It is cold, motionless and shows no breathing."
      - "The Investigator called Warren over and told him there were dead people and non-human beings in the room. Warren approached with his lantern, saw the scene and reacted with shock."
objectives:
  completed:
    - description: "Obtain Warren Thomas's report and briefing about suspected smuggling."
      completion: "Thomas delivered his briefing and handed over the folder of notes."
  active:
    - description: "Investigate why the lighthouse lantern/main light is off."
    - description: "Inspect the discovery Warren Thomas found on the north shore."
  superseded: []
  abandoned: []
open_threads:
  - "Examine the folder of notes in depth."
  - "Clarify the disappearance or unavailability of the lighthouse staff."
  - "Investigate the disappearance of the unmarked vessel spotted near Rockport on February 12, 1926."
  - "Determine why the lamp circuit is interrupted and what caused the lantern room damage."
  - "Identify the two dead men and the two amphibious creatures, and reconstruct the violence in the lantern room."
notes:
  - "The Investigator has never visited Beacon Island before."
  - "The rowboat remains tied to the north shore pier. Its oars are aboard; one oar blade is deeply scraped but usable."
  - "No other survivors have been positively identified by the Investigator."
  - "The north shore discovery Warren mentioned has not yet been inspected."
  - "The folder has been skimmed but not read in depth."
  - "No dice or simulated rolls have been used. No shots have been fired. HP, SAN, MP and Luck remain at their starting values."
